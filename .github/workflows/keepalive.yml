name: Keepalive

on:
  schedule:
    # Mon + Thu 08:00 UTC — prevents Supabase free-tier inactivity pause
    - cron: "0 8 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping deployed site
        run: curl -fsS "${{ secrets.SITE_URL }}" -o /dev/null

      - name: Ping Supabase REST API
        run: |
          curl -fsS \
            "${{ secrets.SUPABASE_URL }}/rest/v1/categories?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -o /dev/null
