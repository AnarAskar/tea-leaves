      name="twitter:description"
      content="Browse our menu and order from your table. Available in English, Arabic, and Kurdish."

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "CafeOrCoffeeShop",
        "name": "Tea Leaves",
        "servesCuisine": ["Tea", "Coffee", "Cafe"],

    <style>
      *{margin:0;padding:0;box-sizing:border-box}
      html{color-scheme:dark}
      html,body{background:#112619;min-height:100dvh}
      @media (prefers-color-scheme:dark){html,body{background:#112619}}
      @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
      .skel-header{height:64px;flex-shrink:0;background:linear-gradient(90deg,#16301f 25%,#21402f 50%,#16301f 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;}
      .skel-cats{display:flex;gap:10px;padding:14px 16px;overflow:hidden;flex-shrink:0;}
      .skel-cat-pill{width:72px;height:72px;border-radius:18px;flex-shrink:0;background:linear-gradient(90deg,#16301f 25%,#21402f 50%,#16301f 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;}
      .skel-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px;overflow:hidden;}
      .skel-card{border-radius:16px;overflow:hidden;background:#193224;}
      .skel-img{height:140px;background:linear-gradient(90deg,#16301f 25%,#21402f 50%,#16301f 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;}
      .skel-body{padding:11px;display:grid;gap:8px;}
      .skel-line{height:12px;border-radius:6px;background:linear-gradient(90deg,#16301f 25%,#21402f 50%,#16301f 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;}
      .skel-line-lg{width:75%;}
      .skel-line-sm{width:45%;}
      .app{width:100%;max-width:430px;min-height:100dvh;background:linear-gradient(180deg,#1b3a2d 0%,#16301f 55%,#112619 100%);display:flex;flex-direction:column;margin:0 auto;overflow:hidden;}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
